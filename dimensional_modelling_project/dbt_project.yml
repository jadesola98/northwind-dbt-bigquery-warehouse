name: 'northwind_warehouse'
version: '1.0.0'

# Must match the profile name in your local ~/.dbt/profiles.yml
profile: 'dimensional_modelling_project1'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  northwind_warehouse:
    staging:
      +materialized: view      # thin pass-through layer, so views keep it cheap
      +schema: stg_northwind
    warehouse:
      +materialized: table
      +schema: dwh_northwind
    analytics_obt:
      +materialized: table
      +schema: obt_northwind
